[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "effect-size-finder"
version = "0.1.0"
description = "Find the papers relevant to a planned study and extract the statistics they report, with Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "anthropic>=2.0,<3",
  "pydantic>=2.6",
  "httpx>=0.27",
  "defusedxml>=0.7",
  "pypdf>=4.0",
  "pyjwt[crypto]>=2.8",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
esf = "esf.cli:main"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
